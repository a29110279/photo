# 在 GitHub 上建置 Android APK（arm64，內建語意模型），完成後於該次執行的 Artifacts 下載。
# 模型取自最近一次成功的 Export model workflow 產物。
#
# 選用設定（Settings › Secrets and variables › Actions）：
#   Secrets    ANDROID_KEYSTORE_BASE64    簽章金鑰（base64），未設定時用每次不同的 debug 金鑰
#              ANDROID_KEYSTORE_PASSWORD
#              ANDROID_KEY_ALIAS
#              ANDROID_KEY_PASSWORD
name: Build APK

on:
  push:
    branches: [claude/project-setup-implementation-p4mac3]
    paths-ignore: ['**.md', 'docs/**', 'tools/**', 'graphify-out/**']
  # 模型重新匯出成功後自動重建。
  workflow_run:
    workflows: [Export model]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download bundled model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 同一個 commit 也觸發了 Export model 時，等它結束，避免打包到舊模型。
          for i in $(seq 1 60); do
            pending=$(gh run list -R "$GITHUB_REPOSITORY" --workflow export-model.yml \
              --commit "$GITHUB_SHA" --json status \
              -q '[.[] | select(.status != "completed")] | length')
            [ "$pending" = "0" ] && break
            echo "等待同一 commit 的 Export model 完成…（$i）"
            sleep 30
          done
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow export-model.yml \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::找不到成功的 Export model 執行，請先到 Actions 執行 Export model。"
            exit 1
          fi
          if ! gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n photo-prompt-model -D assets/model; then
            echo "::error::無法下載模型產物（可能已過期），請重新執行 Export model。"
            exit 1
          fi
          # 人臉模型（O12，選用）：有成功的 Export face model 產物才打包。
          face_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow export-face-model.yml \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$face_id" ]; then
            gh run download "$face_id" -R "$GITHUB_REPOSITORY" -n photo-prompt-face-model -D assets/model \
              || echo "::warning::無法下載人臉模型（可能已過期），人物分群將無法使用。"
          fi
          ls -l assets/model

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未設定簽章金鑰，使用 debug 金鑰；新版 APK 無法直接覆蓋安裝舊版。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # 模型約數百 MB，每個架構都會帶一份，因此只建置手機用的 arm64。
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: photo-prompt-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
