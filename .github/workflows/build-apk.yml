# 在 GitHub 上建置 Android APK，完成後於該次執行的 Artifacts 下載。
#
# 選用設定（Settings › Secrets and variables › Actions）：
#   Variables  MODEL_MANIFEST_URL         預設模型清單網址（不填則在 App 設定頁輸入）
#   Secrets    ANDROID_KEYSTORE_BASE64    簽章金鑰（base64），未設定時用每次不同的 debug 金鑰
#              ANDROID_KEYSTORE_PASSWORD
#              ANDROID_KEY_ALIAS
#              ANDROID_KEY_PASSWORD
name: Build APK

on:
  push:
    branches: [claude/project-setup-implementation-p4mac3]
    paths-ignore: ['**.md', 'docs/**', 'tools/**', 'graphify-out/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未設定簽章金鑰，使用 debug 金鑰；新版 APK 無法直接覆蓋安裝舊版。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        env:
          MODEL_MANIFEST_URL: ${{ vars.MODEL_MANIFEST_URL }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=MODEL_MANIFEST_URL="$MODEL_MANIFEST_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: photo-prompt-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30
