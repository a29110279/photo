# 在 GitHub 上匯出 Chinese-CLIP 模型包並驗證。
# 成功後 Build APK workflow 會自動取用最新一次的產物，把模型打包進 APK。
name: Export model

on:
  workflow_dispatch:
  push:
    branches: [claude/project-setup-implementation-p4mac3]
    paths:
      - 'tools/export_model.py'
      - 'tools/verify_model.py'
      - 'tools/model_check.py'
      - 'tools/requirements.txt'
      - 'lib/services/bert_tokenizer.dart'
      - 'test/tokenizer_vocab_test.dart'
      - '.github/workflows/export-model.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/requirements.txt

      - name: Export
        # 影像輸入 160px：索引速度約為 224px 的 2 倍，中文檢索 R@10 約 90% → 85%（見 Evaluate models）。
        run: python tools/export_model.py --out dist/model --quantize --min-cos 0.96 --image-size 160

      - name: Verify ONNX against PyTorch
        run: python tools/verify_model.py --model-dir dist/model --cases dist/tokenizer_cases.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Verify Dart tokenizer against the real vocab
        env:
          VOCAB_PATH: dist/model/vocab
          CASES_PATH: dist/tokenizer_cases.json
        run: |
          flutter pub get
          flutter test test/tokenizer_vocab_test.dart

      - uses: actions/upload-artifact@v4
        with:
          # 固定名稱：Build APK 以此名稱下載。
          name: photo-prompt-model
          path: |
            dist/model/image
            dist/model/text
            dist/model/vocab
            dist/model/manifest.json
          # 產物過期後 Build APK 會找不到模型，需重新執行本 workflow。
          retention-days: 90
