# 評估候選模型的中文搜尋準確度與速度（手動執行）。結果在該次執行的 Summary 與 Artifacts。
name: Evaluate models

on:
  workflow_dispatch:
    inputs:
      image_size:
        description: '候選影像解析度（例如 160）：先匯出並量化成 App 的模型包，再和目前打包的版本比較。留空則評估全部候選模型。'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pillow onnx onnxruntime sentence-transformers \
            opencc-python-reimplemented requests numpy tqdm six
          pip install --no-deps cn_clip
      - name: Download the model bundled in the app (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow export-model.yml \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n photo-prompt-model -D app_model || true
          fi
      # 這裡的匯出只用於評估，不會觸發 APK 建置（Build APK 只跟隨 Export model）。
      - name: Export the candidate package (quantized)
        if: inputs.image_size != ''
        run: |
          python tools/export_model.py --out cand_model --quantize --min-cos 0.96 \
            --image-size "${{ inputs.image_size }}"
          python tools/verify_model.py --model-dir cand_model --cases cand_cases.json
      - name: Evaluate the candidate against the shipped package
        if: inputs.image_size != ''
        run: |
          python tools/poc/eval_zh_retrieval.py --out eval_report.md --quick \
            --resolutions 224 "${{ inputs.image_size }}" \
            --onnx-dir app_model --onnx-dir cand_model
      - name: Evaluate all candidate models
        if: inputs.image_size == ''
        run: python tools/poc/eval_zh_retrieval.py --out eval_report.md --onnx-dir app_model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval_report.md
          retention-days: 30
